# Create with:  conda env create -f environment.yaml && conda activate ssl-rt
# Versions are those the code was tested with (Linux, CUDA GPU; the default torch wheel ships with CUDA).
name: ssl-rt

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      # deep learning
      - torch==2.10.0
      - lightning==2.6.0
      - torchmetrics==1.8.2
      - timm==1.0.22
      - peft==0.18.1
      - monai==1.5.1
      - torchio==0.21.2
      # configuration and logging
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - omegaconf==2.3.0
      - rootutils==1.0.7
      - rich==14.2.0
      - wandb==0.26.0
      # data handling and metrics
      - numpy==2.3.5
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.6
      - tqdm==4.67.1
      # analysis notebooks (data_analysis/)
      - scipy==1.16.3
      - seaborn==0.13.2
      - statsmodels==0.14.5
      - patsy==1.0.1
      - ipykernel==6.31.0
      # this repository, installed in editable mode as the package `src`
      - -e .
