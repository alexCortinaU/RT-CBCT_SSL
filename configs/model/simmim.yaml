_target_: src.models.simmim_module.SimMIMModule
model_name: vit_small
num_epochs: 100
lr: 0.0005
crop_size: ${data.crop_size}
patch_size: ${data.patch_size}
cls_token: True
normalize_output: True
pos_embed_type: sincos

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  weight_decay: 0.05
  betas: [0.9, 0.999]
  eps: 1e-7 # 1e-7 for AMP, 1e-8 for FP32

scheduler: null

compile: True
