_target_: src.models.lora_module.LoRARegressorModule
lr: 0.0005 # TODO verify
num_epochs: 40 # TODO verify
hidden_layers: [256, 128, 64]
loss:
  _target_: torch.nn.MSELoss

lora_config:
  _target_: peft.LoraConfig
  r: 2
  lora_alpha: 2
  init_lora_weights: pissa
  target_modules: ["attn.qkv", "attn.proj", "mlp.fc1", "mlp.fc2"]
  modules_to_save: ["head"]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 4
  threshold: 0.0005

compile: True
