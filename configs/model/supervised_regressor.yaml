# randomly initialised ViT + regression head (no pretraining baseline)
_target_: src.models.supervised_module.SupervisedRegressorModule
model_name: vit_tiny # vit_tiny | vit_small | vit_base
lr: 0.0005 # TODO verify
num_epochs: 40 # TODO verify
hidden_layers: [256, 128, 64]
crop_size: ${data.crop_size}
patch_size: 16
pos_embed_type: sincos
loss:
  _target_: torch.nn.MSELoss

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 10
  threshold: 0.001

compile: True
