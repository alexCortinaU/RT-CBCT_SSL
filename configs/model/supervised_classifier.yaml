# randomly initialised ViT + head (no pretraining baseline)
_target_: src.models.supervised_module.SupervisedClassifierModule
model_name: vit_tiny # vit_tiny | vit_small | vit_base
lr: 0.0005
num_epochs: 40
hidden_layers: [256, 128, 64]
num_classes: 2
task: binary
loss_type: focal
crop_size: ${data.crop_size}
patch_size: 16
pos_embed_type: sincos

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 10
  threshold: 0.001

compile: True
