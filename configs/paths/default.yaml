# path to root directory (PROJECT_ROOT is set by `rootutils.setup_root` in the scripts)
root_dir: ${oc.env:PROJECT_ROOT}

# dataset used for SimMIM pretraining (see src/data/pretrain_datamodule.py)
pretrain_data_dir: ${oc.env:PRETRAIN_DATA_DIR,${paths.root_dir}/data/pretrain}

# dataset used for the downstream tasks (see src/data/finetune_datamodule.py)
finetune_data_dir: ${oc.env:FINETUNE_DATA_DIR,${paths.root_dir}/data/finetune}

# pretrained checkpoints, stored as <pretrained_dir>/<model_name>/epoch_epoch=<NNN>.ckpt
pretrained_dir: ${oc.env:PRETRAINED_DIR,${paths.root_dir}/models/pretrained}

# path to logging directory
log_dir: ${paths.root_dir}/logs/

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}
