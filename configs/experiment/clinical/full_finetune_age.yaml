# @package _global_
# Age regression (Fig. 5e):
#   python src/finetune.py -m experiment=clinical/full_finetune_age model_name=vit-t,vit-s,vit-b seed=1,2,3,4,5  # five replicates

defaults:
  - override /data: clinical
  - override /model: regressor
  - override /callbacks: finetune_regression
  - override /task: age

model:
  freeze_encoder: False
  hidden_layers: [256, 128, 64]
  lr: 0.0001 # Default
  num_epochs: 50

tags: ["clinical", "age", "full_finetune"]
